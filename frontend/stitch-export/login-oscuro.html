        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center editorial-gradient-bg overflow-hidden">
<!-- Suppressed Shell Logic: Navigation is hidden for transactional Login screen -->
<main class="relative z-10 w-full max-w-md px-6 py-12">
<!-- Brand Logo Anchor -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-surface-container-high rounded-xl flex items-center justify-center mb-4 shadow-2xl border border-outline-variant/20">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="print">print</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tighter text-primary">PrintFlow</h1>
<p class="font-label text-on-surface-variant text-sm tracking-widest mt-2 uppercase">Enterprise Billing</p>
</div>
<!-- Login Card -->
<div class="surface-container-low rounded-xl p-8 shadow-2xl shadow-slate-950/80 border border-outline-variant/10 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary/50 via-primary to-primary/50"></div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-xs font-semibold text-on-surface-variant tracking-wider uppercase" for="email">Correo Electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/30 rounded text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm" id="email" name="email" placeholder="usuario@printflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label text-xs font-semibold text-on-surface-variant tracking-wider uppercase" for="password">Contraseña</label>
<a class="text-[10px] text-primary hover:underline font-bold tracking-tight" href="#">¿OLVIDASTE TU ACCESO?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant/30 rounded text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline text-lg hover:text-on-surface" data-icon="visibility">visibility</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-gradient-to-br from-primary to-inverse-primary text-on-primary font-headline font-extrabold text-sm rounded shadow-[0_0_20px_rgba(164,201,255,0.3)] hover:shadow-[0_0_30px_rgba(164,201,255,0.5)] active:scale-[0.98] transition-all duration-200 uppercase tracking-widest" type="submit">
                    Ingresar al Sistema
                </button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant/10 text-center">
<p class="font-body text-xs text-on-surface-variant">
                    ¿No tienes una cuenta? 
                    <a class="text-primary font-bold hover:underline" href="#">Contactar a Soporte</a>
</p>
</div>
</div>
<!-- Compliance Badge -->
<div class="mt-12 flex flex-col items-center gap-4">
<div class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest rounded-full border border-tertiary/20 shadow-inner">
<span class="material-symbols-outlined text-tertiary text-sm" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-headline text-[10px] font-bold text-on-surface tracking-[0.2em] uppercase">SUNAT COMPLIANCE SECURE</span>
</div>
<div class="flex items-center gap-6 opacity-40">
<span class="font-label text-[10px] tracking-tighter">ISO 27001 CERTIFIED</span>
<span class="font-label text-[10px] tracking-tighter">PCI-DSS COMPLIANT</span>
</div>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="fixed inset-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/5 blur-[120px] rounded-full"></div>
