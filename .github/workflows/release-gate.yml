name: Inkora release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this required check stable, including when prior evidence is reused.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./inkora_ci.db
      SECRET_KEY: inkora-ci-not-for-production
      FISCAL_ENV: beta

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select conservative validation and verify prior evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=(plan --output tmp/release-plan.json)
          if [[ -n "$RELEASE_BASE" && "$RELEASE_BASE" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$RELEASE_BASE")
          fi
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            args+=(--full)
          elif [[ "$RELEASE_EVENT" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            args+=(--reuse-merged-pr)
          fi
          python scripts/release_ci_evidence.py "${args[@]}"

      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-test.txt

      - name: Test validation selection, evidence and current-main protection
        run: |
          python -m unittest discover -s scripts -p 'test_release_*.py'
          python -m unittest discover -s scripts -p 'test_run_e2e_selection.py'

      - name: Install backend system dependencies
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          gcc pkg-config libcairo2-dev

      - name: Install backend dependencies
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        run: python -m pip install -r backend/requirements-test.txt

      - name: Verify backend dependency consistency
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        run: python -m pip check

      - name: Verify operational and release contracts
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: backend
        run: python -m pytest test_release_guard.py test_operational_frontend_contracts.py -q

      - name: Test backend regression without external PostgreSQL
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile == 'full'
        working-directory: backend
        run: >-
          python -m pytest -q
          --ignore=test_sale_dispatch_postgres.py
          --ignore=test_internal_transfer_postgres.py
          --ignore=test_internal_transfer_migration.py
          --ignore=test_cotizaciones_postgres.py
          --ignore=test_inventory_recovery_postgres.py

      - name: Build API container from the canonical root
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile == 'full'
        run: docker build --file Dockerfile --tag inkora-api-ci:${{ github.sha }} .

      - name: Use Node.js 20
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npm run build

      - name: Enforce frontend bundle budgets
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        working-directory: frontend
        run: npm run check:bundle

      - name: Test isolated browser flows selected by scope
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile != 'docs'
        run: python scripts/release_ci_evidence.py e2e --plan tmp/release-plan.json

      - name: Calculate canonical release identity
        run: python scripts/release_guard.py check

      - name: Build worker container from canonical projection
        if: steps.plan.outputs.reuse != 'true' && steps.plan.outputs.profile == 'full'
        shell: bash
        run: |
          identity="$(python scripts/release_guard.py check)"
          content_sha="$(python -c 'import json, sys; print(json.load(sys.stdin)["content_sha256"])' <<<"$identity")"
          python scripts/release_guard.py package \
            --approved-sha256 "$content_sha" --destination tmp/ci-release-package
          python scripts/project_worker_release.py tmp/ci-release-package tmp/ci-worker-projection
          docker build --file tmp/ci-worker-projection/Dockerfile \
            --tag "inkora-worker-ci:${GITHUB_SHA}" tmp/ci-worker-projection/backend

      - name: Record exact validated tree and scope
        env:
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python scripts/release_ci_evidence.py receipt --plan tmp/release-plan.json
          --output tmp/validation-receipt.json

      - name: Retain validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-receipt
          path: tmp/validation-receipt.json
          retention-days: 30
          if-no-files-found: error
